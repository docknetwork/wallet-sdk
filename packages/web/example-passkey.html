<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truvera Web Wallet - Passkey Example</title>
</head>

<body>
  <script src="./dist/wallet-sdk-web.iife.js"></script>

  <script>
    window.addEventListener('load', async () => {
      const wallet = await TruveraWebWallet.initialize({
        edvUrl: 'https://edv.dock.io',
        edvAuthKey: 'edv-auth-key',
        networkId: 'testnet',
        passkey: true,
      });

      if (wallet.mnemonic) {
        console.log('First time setup. Save your recovery phrase:', wallet.mnemonic);
      }

      const credentials = await wallet.getCredentials();
      console.log('Wallet credentials:', credentials);
    });
  </script>
</body>

</html>
