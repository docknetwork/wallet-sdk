<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Truvera Web Wallet - Mnemonic Example</title>
</head>

<body>
  <!-- Load the Truvera Web Wallet bundle -->
  <script src="./dist/wallet-sdk-web.iife.js"></script>

  <script>
    async function initWithMnemonic() {
      const {mnemonic} = await TruveraWebWallet.generateCloudWalletMasterKey();
      const wallet = await TruveraWebWallet.initialize({
        edvUrl: 'https://edv.dock.io',
        edvAuthKey: 'edv-auth-key',
        networkId: 'testnet',
        mnemonic: mnemonic,
      });
      const credentials = await wallet.getCredentials();
      console.log('Mnemonic wallet credentials:', credentials);
    }

    window.addEventListener('load', async () => {
      await initWithMnemonic();
    });
  </script>
</body>

</html>
